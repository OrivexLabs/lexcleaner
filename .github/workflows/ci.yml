name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lexcleaner-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check repository safety guardrails
        run: python3 scripts/check_release_safety.py

      - name: Compile repository verification scripts
        run: python3 -m py_compile scripts/*.py

      - name: Check patch formatting
        run: git diff --check

      - name: Resolve pinned Swift dependencies
        run: swift package resolve

      - name: Run SwiftPM tests
        run: swift test

      - name: Build macOS app target
        run: xcodebuild -project LexCleaner.xcodeproj -scheme LexCleanerApp -configuration Debug -sdk macosx -arch arm64 CODE_SIGNING_ALLOWED=NO build

      - name: Build release package
        run: swift build -c release

      - name: Run real core smoke runners
        run: |
          swift run --skip-build LexCleanerCoreTestRunner
          swift run --skip-build LexCleanerScanTestRunner
          swift run --skip-build LexCleanerClassificationTestRunner --ci
          swift run --skip-build LexCleanerCleanupTestRunner
          swift run --skip-build LexCleanerMonitoringTestRunner
          swift run --skip-build LexCleanerHardwareTestRunner
          swift run --skip-build LexCleanerDiskAnalysisTestRunner
          swift run --skip-build LexCleanerAppManagerTestRunner
          swift run --skip-build LexCleanerSystemToolsTestRunner
